name: Render and Deploy Quarto Document

on:
  push:
    branches:
      - main # Or your default branch
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Needed to commit to gh-pages branch or docs/ folder
  pages: write # Needed if using GitHub Pages specific deployment actions
  id-token: write # Needed for some modern deployment actions

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://cran.rstudio.com/ # Ensure Renv uses a specific CRAN mirror
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # With:
        #   version: "latest" # or a specific version

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest' # Or a specific R version

      - name: Install R Dependencies (System)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev zlib1g-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R Packages (from script)
        run: Rscript scripts/00_install_packages.R
        # Consider adding caching for R packages here in a more advanced setup
        # e.g., using r-lib/actions/setup-r-dependencies@v2

      - name: Run Data Acquisition and Preparation Script
        run: Rscript scripts/01_data_acquisition_preparation.R

      - name: Render Quarto Document
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html # Ensure HTML output
          path: index.qmd # Path to your main Quarto file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Often needed for Quarto to install chromote for webshot if not self-contained

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          path: _site # Explicitly publish the contents of _site
          render: false # Explicitly disable rendering for the publish step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for publishing
